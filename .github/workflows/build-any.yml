name: npm-publish

on:
  push:
    branches:
      - '**'
      - '!master'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
  
    name: npm-publish
    runs-on: ubuntu-latest
    
    permissions: 
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build -- --configuration=production

    # Feature branches run the suite but deliberately do not upload coverage —
    # the service only tracks the default branch and PRs, and an unreviewed
    # branch upload would compete with the PR's own partial build.
    - name: Test
      run: npx nx run-many --target=test --all --coverage --watch=false --parallel=2 --output-style=stream
