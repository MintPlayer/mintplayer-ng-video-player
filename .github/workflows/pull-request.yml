name: pull-request

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Self-hosted Nx remote cache. RW token is only used on push to the default
# branch; everything else (PRs, feature branches) gets the read-only token.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}

permissions:
  contents: read

# The build and the unit tests (test.yml, shared with publish-master.yml) run
# in parallel; the coverage upload follows the tests.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build
        run: npx nx run-many -t build --configuration=production

  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  coverage:
    name: coverage upload
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rebase-lcov-paths.mjs imports only node: built-ins and a local helper.
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage

      # Vitest writes `SF:` paths relative to each project's own root, so
      # `libs/frameworks/r-video-player/src/index.ts` is emitted as
      # `src/index.ts` — a suffix that exists under every library in the
      # workspace. The coverage service resolves report paths against
      # `git ls-files` by longest suffix and drops anything ambiguous from the
      # totals, silently. This rewrites them to workspace-relative and fails
      # loudly if any path stops resolving.
      - name: Rebase coverage paths to workspace-relative
        run: node tools/scripts/rebase-lcov-paths.mjs

      # Nothing in this workflow gates the merge. The service publishes the
      # `coverage/project` and `coverage/patch` check runs itself, and those are
      # what branch protection would require.
      #
      # Every project's report is here (run-many, restored from the Nx cache when
      # unaffected), so this is a whole-workspace upload: no `partial`.
      # `base-sha` is the PR base, passed explicitly: left out, the server falls
      # back to the newest covered default-branch commit, which is not the
      # commit this PR is compared against.
      - name: Upload coverage
        # Fork PRs get no secrets, so the upload cannot work there. Skip rather
        # than fail — a contributor's PR must not go red over a missing token.
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
        with:
          url: https://coverage.mintplayer.com
          token: ${{ secrets.COVERAGE_TOKEN }}
          files: |
            coverage/libs/**/lcov.info
            coverage/tools/lcov.info
          # With search on, a glob that matches nothing silently falls back to
          # auto-detection and would upload stray unparsable reports.
          disable-search: true
          flags: pr
          base-sha: ${{ github.event.pull_request.base.sha }}
          # Closes the build now instead of waiting out the ~2-minute debounce, so
          # the check runs appear while the PR is still being looked at.
          finish: true
          # A coverage-service outage must never be the reason a PR cannot merge.
          fail-ci-if-error: false

  # The single check that sums the parallel jobs up, so branch protection has
  # one stable name to require. `if: always()` so it reports a failure instead
  # of being skipped when a job it needs failed.
  pull-request:
    name: pull-request
    if: always()
    needs: [build, tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: All jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
