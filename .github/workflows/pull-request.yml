name: npm-publish

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
  
    name: npm-publish
    runs-on: ubuntu-latest
    
    permissions: 
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build -- --configuration=production

    - name: Test
      run: npx nx affected --target=test --coverage --watch=false --parallel=true --output-style=stream --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }}

    # Vitest writes `SF:` paths relative to each project's own root, so
    # `libs/frameworks/r-video-player/src/index.ts` is emitted as
    # `src/index.ts` — a suffix that exists under every library in the
    # workspace. The coverage service resolves report paths against
    # `git ls-files` by longest suffix and drops anything ambiguous from the
    # totals, silently. This rewrites them to workspace-relative and fails
    # loudly if any path stops resolving. Jest already emits rooted paths;
    # the script is idempotent, so it leaves those alone.
    - name: Rebase coverage paths to workspace-relative
      id: rebase-coverage
      # `nx affected` legitimately produces nothing on a docs-only PR, and the
      # script treats an empty coverage/ as a hard error. Check first rather
      # than turn such a PR red.
      run: |
        if [ -n "$(find coverage -name lcov.info -print -quit 2>/dev/null)" ]; then
          node tools/scripts/rebase-lcov-paths.mjs
          echo "have-reports=true" >> "$GITHUB_OUTPUT"
        else
          echo "No lcov.info under coverage/ — nothing was affected. Skipping upload."
          echo "have-reports=false" >> "$GITHUB_OUTPUT"
        fi

    # Nothing in this workflow gates the merge. The service publishes the
    # `coverage/project` and `coverage/patch` check runs itself, and those are
    # what branch protection would require.
    #
    # `partial: true` is the load-bearing input. This is `nx affected`, so it
    # measures only the projects the diff touched; without the declaration the
    # server would read a subset as a whole-workspace total and a PR touching
    # one small library would report a near-total collapse. Declared, it
    # compares like-for-like against the same base the affected-computation
    # used — which is why `base-sha` is passed explicitly: left out, the server
    # falls back to the newest covered default-branch commit, which is not the
    # commit `nx affected` diffed against.
    - name: Upload coverage
      # Fork PRs get no secrets, so the upload cannot work there. Skip rather
      # than fail — a contributor's PR must not go red over a missing token.
      if: steps.rebase-coverage.outputs.have-reports == 'true' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        # libs only. The demo apps still run their tests, but their coverage is
        # not a property of the published libraries — counting them lets a demo
        # page move the number the ratchet gates on.
        # `**` because libs nest unevenly — libs/video-player is one level
        # deep, libs/platforms/* and libs/frameworks/* are two.
        files: coverage/libs/**/lcov.info
        # With search on, a glob that matches nothing silently falls back to
        # auto-detection and would upload stray unparsable reports.
        disable-search: true
        flags: pr
        partial: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # Closes the build now instead of waiting out the ~2-minute debounce, so
        # the check runs appear while the PR is still being looked at. Safe for a
        # partial upload only because `partial: true` above tells the server what
        # it is receiving — a partial build can never become the repo headline.
        finish: true
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false
